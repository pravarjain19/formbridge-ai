# Local Supabase for development: `npm run db:start` (needs Docker Desktop).
# Anything not set here uses the Supabase CLI defaults. Reference:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "formbridge-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# scripts/db-local.mjs copies supabase/schema.sql into ./migrations before start/reset.
enabled = true

[db.seed]
enabled = false

# Supabase Studio (database UI): http://127.0.0.1:54323
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit: every login email lands here instead of being sent. http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

# Not used by FormBridge; off to keep the local stack light.
[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
